<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email confirmé — HearSafe</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 360px;
    }
    .check {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #00796D;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .check svg { width: 32px; height: 32px; stroke: white; }
    h1 { font-size: 20px; color: #1a1a1a; margin: 0 0 8px; }
    p { font-size: 15px; color: #666; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Adresse email confirmée</h1>
    <p>Votre compte HearSafe est activé. Vous pouvez retourner sur l'application et vous connecter.</p>
  </div>
</body>
</html>
